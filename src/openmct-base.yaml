# yaml-language-server: $schema=./assets/openmct-configuration-schema.json
openmct:
    version: latest
    plugins:
    - mct-bootstrap-plugin:
        npmPackage: file:./assets/mct-bootstrap-plugin
    - openmct.plugins.Espresso
    - openmct.plugins.MyItems
    - openmct.plugins.LocalStorage
    - openmct.plugins.UTCTimeSystem
    - openmct.plugins.PlanLayout:
        options:
            creatable: true
    - openmct.plugins.DisplayLayout:
        options:
            showAsView:
            - summary-widget
            - example.imagery
    # NOTE: instances that install openmct-mcws-plugin ignore these menus.
    # The mcws TimePlugin installs its own conductor with per-time-system
    # menus generated from its `time` options, overwriting this one. Tune
    # mcws conductor menus via `time.timeSystems` modeSettings instead.
    - openmct.plugins.Conductor:
        options:
          menuOptions:
            - name: Realtime
              timeSystem: utc
              clock: local
              clockOffsets:
                start: -${thirty_minutes}
                end: ${thirty_seconds}
              presets:
                - label: 1 Hour
                  bounds:
                    start: -${one_hour}
                    end: ${thirty_seconds}
                - label: 30 Minutes
                  bounds:
                    start: -${thirty_minutes}
                    end: ${thirty_seconds}
                - label: 15 Minutes
                  bounds:
                    start: -${fifteen_minutes}
                    end: ${thirty_seconds}
                - label: 5 Minutes
                  bounds:
                    start: -${five_minutes}
                    end: ${thirty_seconds}
                - label: 1 Minute
                  bounds:
                    start: -${one_minute}
                    end: ${thirty_seconds}
            - name: Fixed
              timeSystem: utc
              bounds:
                start: ${now} - ${thirty_minutes}
                end: ${now}
              presets:
                - label: Last Day
                  bounds:
                    start: ${now} - ${one_day}
                    end: ${now}
                - label: Last 2 hours
                  bounds:
                    start: ${now} - ${two_hours}
                    end: ${now}
                - label: Last hour
                  bounds:
                    start: ${now} - ${one_hour}
                    end: ${now}
              records: 10