# yaml-language-server: $schema=../../src/assets/openmct-configuration-schema.json
openmct:
    version: stable
    plugins:
    - openmct.plugins.Espresso
    - openmct.plugins.MyItems
    - openmct.plugins.LocalStorage
    - openmct.plugins.UTCTimeSystem
    - openmct.plugins.PlanLayout:
        options:
            creatable: true
    - openmct.plugins.DisplayLayout:
        options:
            showAsView:
            - summary-widget
            - example.imagery
    - mct-bootstrap-plugin:
        npmPackage: file:./assets/mct-bootstrap-plugin
        options:
            timeSystem: utc
            clock: local
            startOffset: -60000
            endOffset: 0
            mode: realtime