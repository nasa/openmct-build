# yaml-language-server: $schema=../../../src/assets/openmct-configuration-schema.json
# Note: recipe plugin options merge with the build tool's base configuration
# (arrays merge index-wise), so both conductor menus are defined here in full
# to keep the merged result deterministic.
openmct:
  version: stable
  plugins:
    - openmct.plugins.UTCTimeSystem
    - openmct.plugins.Conductor:
        options:
          menuOptions:
            - name: Realtime
              timeSystem: utc
              clock: local
              clockOffsets:
                start: '-${thirty_minutes}'
                end: ${thirty_seconds}
              presets:
                - label: 1 Hour
                  bounds:
                    start: '-${one_hour}'
                    end: ${thirty_seconds}
                - label: 30 Minutes
                  bounds:
                    start: '-${thirty_minutes}'
                    end: ${thirty_seconds}
                - label: 15 Minutes
                  bounds:
                    start: '-${fifteen_minutes}'
                    end: ${thirty_seconds}
                - label: 5 Minutes
                  bounds:
                    start: '-${five_minutes}'
                    end: ${thirty_seconds}
                - label: 1 Minute
                  bounds:
                    start: '-${one_minute}'
                    end: ${thirty_seconds}
            - name: Fixed
              timeSystem: utc
              bounds:
                start: ${now} - ${one_day}
                end: ${now}
              presets:
                - label: Last Day (frozen at load)
                  bounds:
                    start: ${now} - ${one_day}
                    end: ${now}
                - label: Last 2 hours (dynamic)
                  bounds:
                    start: '${dynamic:${now} - ${two_hours}}'
                    end: '${dynamic:${now}}'
                - label: Last hour (frozen at load)
                  bounds:
                    start: ${now} - ${one_hour}
                    end: ${now}
