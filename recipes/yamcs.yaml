# yaml-language-server: $schema=../src/assets/openmct-configuration-schema.json
openmct:
  version: '4.1.0'
  plugins:
  - akhenry/openmct-yamcs:
      options:
        yamcsDictionaryEndpoint: 'http://localhost:8090/'
        yamcsHistoricalEndpoint: 'http://localhost:8090/'
        yamcsInstance: 'myproject'
        yamcsFolder: 'myproject'
        yamcsProcessor: 'realtime'
        yamcsWebsocketEndpoint: 'http://localhost:8090/api/websocket'
